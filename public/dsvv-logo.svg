<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" stroke="#ffc107" stroke-width="3"/>
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#ffc107" stroke-width="1.5"/>
  <!-- Top text arc -->
  <path id="topArc" d="M 30,100 a 70,70 0 0,1 140,0" fill="none"/>
  <text font-family="serif" font-size="13" font-weight="bold" fill="#ffffff" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">DEV SANSKRITI</textPath>
  </text>
  <!-- Bottom text arc -->
  <path id="bottomArc" d="M 30,100 a 70,70 0 0,0 140,0" fill="none"/>
  <text font-family="serif" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">VISHWAVIDYALAYA</textPath>
  </text>
  <!-- Center text -->
  <text x="100" y="90" text-anchor="middle" font-family="serif" font-size="28" font-weight="bold" fill="#ffc107">DSVV</text>
  <!-- Hindi text -->
  <text x="100" y="118" text-anchor="middle" font-family="serif" font-size="11" fill="#ffffff">देव संस्कृति विश्वविद्यालय</text>
  <!-- Location -->
  <text x="100" y="138" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ffc107" letter-spacing="1">DURG, CHHATTISGARH</text>
  <!-- Decorative stars -->
  <circle cx="45" cy="100" r="2.5" fill="#ffc107"/>
  <circle cx="155" cy="100" r="2.5" fill="#ffc107"/>
</svg>
